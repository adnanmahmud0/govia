name: Build Docker Images & Deploy to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 1: Build Docker Images in GitHub and Push to GitHub Container Registry
  # ============================================================================
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/govia-api:latest
            ghcr.io/${{ github.repository_owner }}/govia-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Admin Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=http://${{ secrets.SERVER_HOST || '172.252.13.197' }}:9777/api/v1
            NEXT_PUBLIC_SOCKET_URL=http://${{ secrets.SERVER_HOST || '172.252.13.197' }}:9777
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/govia-admin:latest
            ghcr.io/${{ github.repository_owner }}/govia-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2: Deploy to Remote Server via SSH & Launch Stack
  # ============================================================================
  deploy:
    name: Deploy to Server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Generate Production Configuration
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || '172.252.13.197' }}
          MONGO_PASS: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          mkdir -p deploy-payload

          cat << EOF > deploy-payload/.env
          NODE_ENV=production
          PROJECT_NAME=Govia
          ENABLE_API_DOCS=true

          PORT=5000
          IP_ADDRESS=0.0.0.0

          HOST_API_PORT=9777
          HOST_ADMIN_PORT=8777

          MONGO_INITDB_ROOT_USERNAME=goviaAdmin
          MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASS}
          MONGO_INITDB_DATABASE=govia-db

          DATABASE_URL=mongodb://goviaAdmin:${MONGO_PASS}@adnan-govia-mongo:27017/govia-db?authSource=admin

          BCRYPT_SALT_ROUNDS=10
          JWT_SECRET=${JWT_SECRET}
          JWT_EXPIRE_IN=1h

          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_REFRESH_EXPIRE_IN=7d

          SUPER_ADMIN_EMAIL=admin@govia.com
          SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD}

          ZOOM_ACCOUNT_ID=${ZOOM_ACCOUNT_ID}
          ZOOM_CLIENT_ID=${ZOOM_CLIENT_ID}
          ZOOM_CLIENT_SECRET=${ZOOM_CLIENT_SECRET}

          AI_PROVIDER_BASE_URL=https://openrouter.ai/api/v1
          AI_API_KEY=${AI_API_KEY}
          AI_MODEL_NAME=openrouter/free

          EMAIL_FROM=adnan99mahmud@gmail.com
          EMAIL_USER=adnan99mahmud@gmail.com
          EMAIL_PORT=587
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PASS=${EMAIL_PASS}

          NEXT_PUBLIC_API_URL=http://${SERVER_HOST}:9777/api/v1
          NEXT_PUBLIC_SOCKET_URL=http://${SERVER_HOST}:9777
          EOF

          cat << 'EOF' > deploy-payload/docker-compose.prod.yml
          name: govia-production

          services:
            adnan-govia-mongo:
              image: mongo:7.0-alpine
              container_name: adnan-govia-mongo
              restart: always
              environment:
                MONGO_INITDB_ROOT_USERNAME: goviaAdmin
                MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
                MONGO_INITDB_DATABASE: govia-db
              volumes:
                - govia_mongodb_data:/data/db
              networks:
                - govia_network
              healthcheck:
                test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
                interval: 10s
                timeout: 5s
                retries: 5
                start_period: 15s

            adnan-govia-api:
              image: ghcr.io/adnanmahmud0/govia-api:latest
              container_name: adnan-govia-api
              restart: always
              ports:
                - "9777:5000"
              env_file:
                - .env
              volumes:
                - govia_uploads:/app/apps/api/uploads
                - govia_logs:/app/apps/api/winston
              depends_on:
                adnan-govia-mongo:
                  condition: service_healthy
              networks:
                - govia_network
              healthcheck:
                test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5000/', (res) => { if (res.statusCode !== 200) process.exit(1); })"]
                interval: 15s
                timeout: 5s
                retries: 5
                start_period: 20s

            adnan-govia-admin:
              image: ghcr.io/adnanmahmud0/govia-admin:latest
              container_name: adnan-govia-admin
              restart: always
              ports:
                - "8777:3000"
              env_file:
                - .env
              depends_on:
                adnan-govia-api:
                  condition: service_started
              networks:
                - govia_network

          volumes:
            govia_mongodb_data:
              name: adnan_govia_mongodb_data
            govia_uploads:
              name: adnan_govia_uploads
            govia_logs:
              name: adnan_govia_logs

          networks:
            govia_network:
              name: adnan_govia_network
              driver: bridge
          EOF

      - name: Deploy to Server via SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST || '172.252.13.197' }}
          SERVER_USER: ${{ secrets.SERVER_USER || 'root' }}
          SERVER_PASS: ${{ secrets.SERVER_PASSWORD }}
          SERVER_PORT: ${{ secrets.SERVER_SSH_PORT || '22' }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          TARGET_HOST="${SERVER_HOST:-172.252.13.197}"
          TARGET_USER="${SERVER_USER:-root}"
          TARGET_PORT="${SERVER_PORT:-22}"
          if [ -z "$TARGET_PORT" ]; then TARGET_PORT=22; fi

          export SSHPASS="$SERVER_PASS"

          if [ -z "$SSHPASS" ]; then
            echo "❌ ERROR: SERVER_PASSWORD secret is not configured or is empty in GitHub repository secrets!" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "🚀 Testing SSH connection to ${TARGET_USER}@${TARGET_HOST}:${TARGET_PORT}..."
          if ! sshpass -e ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "echo '✅ SSH connection successful! Host: \$(hostname)'" > /tmp/ssh_test.log 2>&1; then
            echo "### ❌ SSH Connection / Authentication Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 35 /tmp/ssh_test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ssh_test.log
            exit 1
          fi
          echo "✅ SSH connection verified!"

          # 1. Create target directory and ensure Docker is installed
          echo "📦 Verifying Docker on server..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "
            mkdir -p /adnan/govia
            if ! command -v docker &>/dev/null; then
              echo '📦 Installing Docker...'
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sh /tmp/get-docker.sh
            fi
          "

          # 2. Upload .env and docker-compose.prod.yml
          echo "📤 Uploading production configuration to /adnan/govia..."
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$TARGET_PORT" deploy-payload/.env deploy-payload/docker-compose.prod.yml "${TARGET_USER}@${TARGET_HOST}:/adnan/govia/"

          # 3. Pull latest images and launch stack
          echo "🐳 Pulling latest Docker images and starting services..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$TARGET_PORT" "${TARGET_USER}@${TARGET_HOST}" "
            set -e
            cd /adnan/govia
            chmod 600 .env

            # Open firewall ports
            if command -v ufw &>/dev/null; then
              echo '🔓 Opening firewall ports for Govia (9777, 8777)...'
              ufw allow 22/tcp || true
              ufw allow 80/tcp || true
              ufw allow 443/tcp || true
              ufw allow 9777/tcp || true
              ufw allow 8777/tcp || true
              ufw reload || true
            fi

            echo '📥 Pulling images from GitHub Container Registry...'
            docker compose -f docker-compose.prod.yml pull

            echo '🚀 Starting containers...'
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f

            echo '⏳ Waiting for containers to initialize (15s)...'
            sleep 15

            echo '📊 Container status:'
            docker compose -f docker-compose.prod.yml ps

            echo '📋 API Logs:'
            docker compose -f docker-compose.prod.yml logs --tail 20 adnan-govia-api || true

            echo '📋 Admin Dashboard Logs:'
            docker compose -f docker-compose.prod.yml logs --tail 20 adnan-govia-admin || true

            echo '🌐 Testing local response:'
            curl -I -s --connect-timeout 5 http://127.0.0.1:9777/api/v1/docs | head -n 5 || true
            curl -I -s --connect-timeout 5 http://127.0.0.1:8777/ | head -n 5 || true
          "

          echo "🎉 Govia deployment successfully completed on ${TARGET_HOST}!"
          echo "👉 Frontend: http://${TARGET_HOST}:8777"
          echo "👉 Backend:  http://${TARGET_HOST}:9777/api/v1/docs"
