name: Govia Production Deployment (Direct Push)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  check-secrets:
    name: Check Deployment Secrets
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.SERVER_HOST || secrets.VPS_SSH_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "✅ Server connection secrets are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Deployment skipped: SERVER_HOST secret is not configured in GitHub repository settings."
          fi

  deploy:
    name: Direct Push & Deploy to VPS
    needs: check-secrets
    if: needs.check-secrets.outputs.configured == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Directly copy repository files to /adnan/govia on the server
      - name: Push Code Directly to Server via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_SSH_USER }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.VPS_SSH_PASSWORD }}
          key: ${{ secrets.SERVER_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || secrets.VPS_SSH_PORT || 22 }}
          target: ${{ secrets.VPS_DEPLOY_PATH || '/adnan/govia' }}
          source: 'apps,packages,scripts,package.json,package-lock.json,turbo.json,docker-compose.prod.yml,docker-compose.yml,.dockerignore,.env.example'
          overwrite: true

      # 2. Configure .env and trigger Docker build & restart on the server
      - name: Execute Deployment on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST || secrets.VPS_SSH_HOST }}
          username: ${{ secrets.SERVER_USER || secrets.VPS_SSH_USER }}
          password: ${{ secrets.SERVER_PASSWORD || secrets.VPS_SSH_PASSWORD }}
          key: ${{ secrets.SERVER_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.SERVER_SSH_PORT || secrets.VPS_SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH,SERVER_IP,SECRET_MONGO_PASSWORD,SECRET_JWT_SECRET,SECRET_JWT_REFRESH_SECRET,SECRET_SUPER_ADMIN_PASSWORD,SECRET_ZOOM_ACCOUNT_ID,SECRET_ZOOM_CLIENT_ID,SECRET_ZOOM_CLIENT_SECRET,SECRET_AI_API_KEY,SECRET_EMAIL_PASS
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH || '/adnan/govia' }}
          SERVER_IP: ${{ secrets.SERVER_HOST || secrets.VPS_SSH_HOST || '172.252.13.197' }}
          SECRET_MONGO_PASSWORD: ${{ secrets.MONGO_INITDB_ROOT_PASSWORD }}
          SECRET_JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SECRET_JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SECRET_SUPER_ADMIN_PASSWORD: ${{ secrets.SUPER_ADMIN_PASSWORD }}
          SECRET_ZOOM_ACCOUNT_ID: ${{ secrets.ZOOM_ACCOUNT_ID }}
          SECRET_ZOOM_CLIENT_ID: ${{ secrets.ZOOM_CLIENT_ID }}
          SECRET_ZOOM_CLIENT_SECRET: ${{ secrets.ZOOM_CLIENT_SECRET }}
          SECRET_AI_API_KEY: ${{ secrets.AI_API_KEY }}
          SECRET_EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        script: |
          set -e
          DEPLOY_DIR="${DEPLOY_PATH/#\~/$HOME}"
          echo "📁 Working Directory on Server: $DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          # 1. Ensure scripts are executable
          chmod +x scripts/*.sh 2>/dev/null || true

          # 2. Dynamically construct production .env file using repository secrets
          echo "🔒 Generating production .env file..."
          cat << EOF > .env
          NODE_ENV=production
          PROJECT_NAME=Govia
          ENABLE_API_DOCS=true

          PORT=5000
          IP_ADDRESS=0.0.0.0

          HOST_API_PORT=9777
          HOST_ADMIN_PORT=8777

          MONGO_INITDB_ROOT_USERNAME=goviaAdmin
          MONGO_INITDB_ROOT_PASSWORD=${SECRET_MONGO_PASSWORD:-GoviaMongoSecurePass2026!}
          MONGO_INITDB_DATABASE=govia-db

          DATABASE_URL=mongodb://goviaAdmin:${SECRET_MONGO_PASSWORD:-GoviaMongoSecurePass2026!}@adnan-govia-mongo:27017/govia-db?authSource=admin

          BCRYPT_SALT_ROUNDS=10
          JWT_SECRET=${SECRET_JWT_SECRET}
          JWT_EXPIRE_IN=1h

          JWT_REFRESH_SECRET=${SECRET_JWT_REFRESH_SECRET}
          JWT_REFRESH_EXPIRE_IN=7d

          SUPER_ADMIN_EMAIL=admin@govia.com
          SUPER_ADMIN_PASSWORD=${SECRET_SUPER_ADMIN_PASSWORD:-GoviaAdminPass2026!}

          ZOOM_ACCOUNT_ID=${SECRET_ZOOM_ACCOUNT_ID}
          ZOOM_CLIENT_ID=${SECRET_ZOOM_CLIENT_ID}
          ZOOM_CLIENT_SECRET=${SECRET_ZOOM_CLIENT_SECRET}

          AI_PROVIDER_BASE_URL=https://openrouter.ai/api/v1
          AI_API_KEY=${SECRET_AI_API_KEY}
          AI_MODEL_NAME=openrouter/free

          EMAIL_FROM=adnan99mahmud@gmail.com
          EMAIL_USER=adnan99mahmud@gmail.com
          EMAIL_PORT=587
          EMAIL_HOST=smtp.gmail.com
          EMAIL_PASS=${SECRET_EMAIL_PASS}

          NEXT_PUBLIC_API_URL=http://${SERVER_IP}:9777/api/v1
          NEXT_PUBLIC_SOCKET_URL=http://${SERVER_IP}:9777
          EOF

          chmod 600 .env
          echo "✅ Production .env written securely"

          # 3. Build & Launch Docker Compose containers
          echo "🐳 Launching Docker Compose containers..."
          docker compose -f docker-compose.prod.yml up -d --build --remove-orphans

          # 4. Wait for initialization
          sleep 12

          # 5. Diagnostic Health Check
          echo "📊 Container Status:"
          docker compose -f docker-compose.prod.yml ps

          # 6. Clean dangling images
          docker image prune -f

          echo "🎉 Direct deployment to $DEPLOY_DIR on $SERVER_IP completed successfully!"
