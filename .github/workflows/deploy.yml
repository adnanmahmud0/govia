name: Govia Production CI/CD (Zero-Manual-SSH & Blue/Green Deploy)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_flutter:
        description: '📱 Build Flutter Android Release APK?'
        required: false
        type: boolean
        default: true

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 0: Idempotent Server Bootstrap (Runs in parallel with Quality Gate)
  # ============================================================================
  setup-server:
    name: ⚙️ Bootstrap Remote Server
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Server Connection Parameters
        run: |
          TARGET_HOST="${{ secrets.SERVER_HOST || secrets.EC2_HOST || '108.175.15.205' }}"
          TARGET_USER="${{ secrets.SERVER_USER || secrets.EC2_USER || 'root' }}"
          TARGET_PASS="${{ secrets.SERVER_PASSWORD || secrets.EC2_PASSWORD || 'sh6tSHJo0PloP' }}"
          TARGET_KEY="${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}"
          TARGET_PORT="${{ secrets.SERVER_SSH_PORT || '22' }}"

          echo "SERVER_HOST=${TARGET_HOST}" >> $GITHUB_ENV
          echo "SERVER_USER=${TARGET_USER}" >> $GITHUB_ENV
          echo "SERVER_PORT=${TARGET_PORT}" >> $GITHUB_ENV
          echo "SERVER_PASS=${TARGET_PASS}" >> $GITHUB_ENV

          if [ -n "$TARGET_KEY" ]; then
            echo "HAS_SSH_KEY=true" >> $GITHUB_ENV
            mkdir -p ~/.ssh
            echo "$TARGET_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          else
            echo "HAS_SSH_KEY=false" >> $GITHUB_ENV
          fi

      - name: Execute Server Self-Bootstrap via SSH
        env:
          SSHPASS: ${{ env.SERVER_PASS }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          run_ssh() {
            local cmd="$1"
            if [ "$HAS_SSH_KEY" = "true" ]; then
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "$cmd"
            else
              sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "$cmd"
            fi
          }

          run_scp() {
            local src="$1"
            local dest="$2"
            dest="${dest#*@*:}"
            if [ "$HAS_SSH_KEY" = "true" ]; then
              scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -P "$SERVER_PORT" -r $src "${SERVER_USER}@${SERVER_HOST}:${dest}"
            else
              sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SERVER_PORT" -r $src "${SERVER_USER}@${SERVER_HOST}:${dest}"
            fi
          }

          echo "🚀 Testing connection to ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}..."
          run_ssh "echo '✅ Connection established to \$(hostname)'"

          echo "📁 Ensuring directory structure exists on server..."
          run_ssh "mkdir -p /adnan/govia/scripts/server /adnan/govia/backups/mongodb"

          echo "📤 Uploading bootstrap scripts & manifests..."
          run_scp scripts/server/* "/adnan/govia/scripts/server/"
          run_scp docker-compose.bluegreen.yml "/adnan/govia/docker-compose.bluegreen.yml"
          run_scp docker-compose.prod.yml "/adnan/govia/docker-compose.prod.yml"

          echo "🔧 Running idempotent server bootstrap (swap, Docker, Nginx, cron)..."
          run_ssh "chmod +x /adnan/govia/scripts/server/*.sh && /adnan/govia/scripts/server/bootstrap.sh"
          echo "✅ Server bootstrap complete!"

  # ============================================================================
  # Stage 1: Quality Gate (Linting & TypeScript Verification across Monorepo)
  # ============================================================================
  quality-gate:
    name: 🛡️ Monorepo Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compilation Check
        run: npm run typecheck

  # ============================================================================
  # Stage 2A: Build API Docker Image & Push to GHCR
  # ============================================================================
  build-api:
    name: 🐳 Build & Push API Image
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/govia-api:latest
            ghcr.io/${{ env.REPO_OWNER }}/govia-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2B: Build Admin Dashboard Docker Image & Push to GHCR
  # ============================================================================
  build-admin:
    name: 🌐 Build & Push Admin Dashboard Image
    needs: quality-gate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Repository Owner
        run: echo "REPO_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Unpack Environment for Build Args
        run: |
          if [ -n "${{ secrets.PROD_ENV }}" ]; then
            echo "${{ secrets.PROD_ENV }}" > .env
          elif [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

          get_val() {
            local key="$1"
            local fallback="$2"
            local val
            val=$(grep -E "^${key}=" .env | cut -d'=' -f2- | tr -d '\r' | tr -d '"' | tr -d "'" | head -n 1)
            echo "${val:-$fallback}"
          }

          API_URL=$(get_val "NEXT_PUBLIC_API_URL" "https://api.govia.app/api/v1")
          SOCKET_URL=$(get_val "NEXT_PUBLIC_SOCKET_URL" "https://api.govia.app")

          echo "NEXT_PUBLIC_API_URL=${API_URL}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SOCKET_URL=${SOCKET_URL}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.NEXT_PUBLIC_SOCKET_URL }}
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER }}/govia-admin:latest
            ghcr.io/${{ env.REPO_OWNER }}/govia-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2C: Build Flutter Android Release APK
  # ============================================================================
  build-flutter:
    name: 📱 Build Flutter Android Release APK
    needs: quality-gate
    if: github.event_name != 'pull_request' || github.event.inputs.build_flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Flutter .env
        run: |
          if [ -n "${{ secrets.PROD_ENV }}" ]; then
            echo "${{ secrets.PROD_ENV }}" > apps/mobile/.env
          elif [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > apps/mobile/.env
          else
            cp apps/mobile/.env.example apps/mobile/.env 2>/dev/null || cp .env.example apps/mobile/.env
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation
        working-directory: apps/mobile

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: govia-android-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 30

  # ============================================================================
  # Stage 3: Zero-Downtime Blue/Green Deployment to Production Server
  # ============================================================================
  deploy:
    name: 🚀 Zero-Downtime Blue/Green Deploy
    needs: [setup-server, build-api, build-admin]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Sanitized Environment & Payload
        run: |
          mkdir -p deploy-payload/scripts/server

          # Unpack environment configuration
          if [ -n "${{ secrets.PROD_ENV }}" ]; then
            echo "${{ secrets.PROD_ENV }}" > deploy-payload/.env.raw
          elif [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > deploy-payload/.env.raw
          else
            cp .env deploy-payload/.env.raw 2>/dev/null || cp .env.example deploy-payload/.env.raw
          fi

          # POSIX Stream-clean: strip Windows CRLF (\r), trim whitespace, reject malformed keys
          tr -d '\r' < deploy-payload/.env.raw | \
            sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | \
            grep -E '^[A-Za-z_][A-Za-z0-9_]*=' > deploy-payload/.env || true

          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "GH_REPO_OWNER=${REPO_OWNER}" >> deploy-payload/.env

          # Helper to read .env values
          get_val() {
            local key="$1"
            local fallback="$2"
            local val
            val=$(grep -E "^${key}=" deploy-payload/.env | cut -d'=' -f2- | tr -d '\r' | tr -d '"' | tr -d "'" | head -n 1)
            echo "${val:-$fallback}"
          }

          TARGET_HOST="${{ secrets.SERVER_HOST || secrets.EC2_HOST }}"
          [ -z "$TARGET_HOST" ] && TARGET_HOST=$(get_val "SERVER_HOST" "108.175.15.205")

          TARGET_USER="${{ secrets.SERVER_USER || secrets.EC2_USER }}"
          [ -z "$TARGET_USER" ] && TARGET_USER=$(get_val "SERVER_USER" "root")

          TARGET_PASS="${{ secrets.SERVER_PASSWORD || secrets.EC2_PASSWORD }}"
          [ -z "$TARGET_PASS" ] && TARGET_PASS=$(get_val "SERVER_PASSWORD" "sh6tSHJo0PloP")

          TARGET_KEY="${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}"

          TARGET_PORT="${{ secrets.SERVER_SSH_PORT }}"
          [ -z "$TARGET_PORT" ] && TARGET_PORT=$(get_val "SERVER_SSH_PORT" "22")

          DOMAIN_NAME=$(get_val "DOMAIN_NAME" "govia.app")

          echo "SERVER_HOST=${TARGET_HOST}" >> $GITHUB_ENV
          echo "SERVER_USER=${TARGET_USER}" >> $GITHUB_ENV
          echo "SERVER_PASS=${TARGET_PASS}" >> $GITHUB_ENV
          echo "SERVER_PORT=${TARGET_PORT}" >> $GITHUB_ENV
          echo "DOMAIN_NAME=${DOMAIN_NAME}" >> $GITHUB_ENV
          echo "REPO_OWNER=${REPO_OWNER}" >> $GITHUB_ENV

          if [ -n "$TARGET_KEY" ]; then
            echo "HAS_SSH_KEY=true" >> $GITHUB_ENV
            mkdir -p ~/.ssh
            echo "$TARGET_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          else
            echo "HAS_SSH_KEY=false" >> $GITHUB_ENV
          fi

          # Copy compose files and server scripts
          cp docker-compose.bluegreen.yml deploy-payload/
          cp docker-compose.prod.yml deploy-payload/
          cp scripts/server/* deploy-payload/scripts/server/

      - name: Deploy to Remote Server via SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ env.REPO_OWNER }}
          SSHPASS: ${{ env.SERVER_PASS }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          run_ssh() {
            local cmd="$1"
            if [ "$HAS_SSH_KEY" = "true" ]; then
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "$cmd"
            else
              sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "$cmd"
            fi
          }

          run_scp() {
            local src="$1"
            local dest="$2"
            dest="${dest#*@*:}"
            if [ "$HAS_SSH_KEY" = "true" ]; then
              scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -P "$SERVER_PORT" -r $src "${SERVER_USER}@${SERVER_HOST}:${dest}"
            else
              sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SERVER_PORT" -r $src "${SERVER_USER}@${SERVER_HOST}:${dest}"
            fi
          }

          echo "🚀 Connecting to production server ${SERVER_HOST}..."
          run_ssh "echo '✅ Connection verified: \$(hostname)'"

          echo "📤 Uploading manifests and deployment configuration to /adnan/govia..."
          run_scp deploy-payload/.env "/adnan/govia/.env"
          run_scp deploy-payload/docker-compose.bluegreen.yml "/adnan/govia/docker-compose.bluegreen.yml"
          run_scp deploy-payload/docker-compose.prod.yml "/adnan/govia/docker-compose.prod.yml"
          run_scp deploy-payload/scripts/server/* "/adnan/govia/scripts/server/"

          echo "🚀 Executing Blue/Green zero-downtime deployment on server..."
          run_ssh "
            set -e
            cd /adnan/govia
            chmod 600 .env
            chmod +x scripts/server/*.sh

            echo '🔐 Authenticating Docker with GHCR...'
            echo \"$GH_TOKEN\" | docker login ghcr.io -u \"$GH_ACTOR\" --password-stdin

            echo '🔄 Executing zero-downtime Blue/Green swap...'
            GH_REPO_OWNER=\"$REPO_OWNER\" ./scripts/server/deploy-bluegreen.sh
          "

          echo "🎉 Govia Blue/Green deployment completed successfully!"

  # ============================================================================
  # Stage 4: Automated Let's Encrypt HTTPS / SSL Engine
  # ============================================================================
  ssl-setup:
    name: 🔒 Let's Encrypt SSL Setup
    needs: deploy
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Resolve Server Connection Parameters
        run: |
          TARGET_HOST="${{ secrets.SERVER_HOST || secrets.EC2_HOST || '108.175.15.205' }}"
          TARGET_USER="${{ secrets.SERVER_USER || secrets.EC2_USER || 'root' }}"
          TARGET_PASS="${{ secrets.SERVER_PASSWORD || secrets.EC2_PASSWORD || 'sh6tSHJo0PloP' }}"
          TARGET_KEY="${{ secrets.SERVER_SSH_KEY || secrets.EC2_SSH_KEY }}"
          TARGET_PORT="${{ secrets.SERVER_SSH_PORT || '22' }}"

          echo "SERVER_HOST=${TARGET_HOST}" >> $GITHUB_ENV
          echo "SERVER_USER=${TARGET_USER}" >> $GITHUB_ENV
          echo "SERVER_PORT=${TARGET_PORT}" >> $GITHUB_ENV
          echo "SERVER_PASS=${TARGET_PASS}" >> $GITHUB_ENV

          if [ -n "$TARGET_KEY" ]; then
            echo "HAS_SSH_KEY=true" >> $GITHUB_ENV
            mkdir -p ~/.ssh
            echo "$TARGET_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
          else
            echo "HAS_SSH_KEY=false" >> $GITHUB_ENV
          fi

      - name: Issue & Renew Let's Encrypt SSL Certificates
        env:
          SSHPASS: ${{ env.SERVER_PASS }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          run_ssh() {
            local cmd="$1"
            if [ "$HAS_SSH_KEY" = "true" ]; then
              ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/deploy_key -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "$cmd"
            else
              sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "$cmd"
            fi
          }

          echo "🔒 Inspecting domain DNS resolution and issuing Let's Encrypt certificates..."
          run_ssh "
            set -e

            # Verify which domains resolve to this server
            SERVER_IP=\$(curl -s https://api.ipify.org || echo '${SERVER_HOST}')
            DOMAINS=()

            check_dns() {
              local domain=\"\$1\"
              local resolved
              resolved=\$(getent ahosts \"\$domain\" 2>/dev/null | awk '{print \$1}' | head -n 1 || echo '')
              if [ \"\$resolved\" = \"\$SERVER_IP\" ] || [ \"\$resolved\" = '${SERVER_HOST}' ]; then
                echo \"✅ Domain \$domain resolves to \$resolved\"
                DOMAINS+=(-d \"\$domain\")
              else
                echo \"ℹ️ Domain \$domain resolves to '\$resolved' (Server is \$SERVER_IP). Skipping cert for \$domain for now.\"
              fi
            }

            check_dns \"api.govia.app\"
            check_dns \"admin.govia.app\"
            check_dns \"govia.app\"
            check_dns \"www.govia.app\"

            if [ \${#DOMAINS[@]} -gt 0 ]; then
              echo \"🔐 Requesting Let's Encrypt certificate for: \${DOMAINS[*]}\"
              certbot --nginx \
                \"\${DOMAINS[@]}\" \
                --non-interactive \
                --agree-tos \
                -m admin@govia.com \
                --redirect \
                --expand || true

              nginx -t && systemctl reload nginx || true
              echo \"🎉 SSL certificates successfully configured & active!\"
            else
              echo \"⚠️ No domains currently resolve to this server IP yet.\"
            fi
          "

          echo "========================================================"
          echo "🎉 PRODUCTION DEPLOYMENT & SSL COMPLETE!"
          echo "👉 Admin Dashboard: https://admin.govia.app"
          echo "👉 API Backend:     https://api.govia.app/health"
          echo "👉 API Swagger:     https://api.govia.app/api/v1"
          echo "========================================================"
