name: Govia Production CI/CD (Quality Gate, Docker, Flutter & Zero-Downtime Deploy)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================================
  # Stage 1: Quality Gate (Linting & TypeScript Verification across Monorepo)
  # ============================================================================
  quality-gate:
    name: 🛡️ Monorepo Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Compilation Check
        run: npm run typecheck

  # ============================================================================
  # Stage 2A: Build API Docker Image & Push to GHCR
  # ============================================================================
  build-api:
    name: 🐳 Build & Push API Image
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/govia-api:latest
            ghcr.io/${{ github.repository_owner }}/govia-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2B: Build Admin Dashboard Docker Image & Push to GHCR
  # ============================================================================
  build-admin:
    name: 🌐 Build & Push Admin Dashboard Image
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unpack Environment for Build Args
        run: |
          if [ -n "${{ secrets.PROD_ENV }}" ]; then
            echo "${{ secrets.PROD_ENV }}" > .env
          elif [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > .env
          else
            cp .env.example .env
          fi

          get_val() {
            local key="$1"
            local fallback="$2"
            local val
            val=$(grep -E "^${key}=" .env | cut -d'=' -f2- | tr -d '\r' | tr -d '"' | tr -d "'" | head -n 1)
            echo "${val:-$fallback}"
          }

          API_URL=$(get_val "NEXT_PUBLIC_API_URL" "http://172.252.13.197:9777/api/v1")
          SOCKET_URL=$(get_val "NEXT_PUBLIC_SOCKET_URL" "http://172.252.13.197:9777")

          echo "NEXT_PUBLIC_API_URL=${API_URL}" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SOCKET_URL=${SOCKET_URL}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Admin Dashboard image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/admin/Dockerfile
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_SOCKET_URL=${{ env.NEXT_PUBLIC_SOCKET_URL }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/govia-admin:latest
            ghcr.io/${{ github.repository_owner }}/govia-admin:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # Stage 2C: Build Flutter Android Release APK
  # ============================================================================
  build-flutter:
    name: 📱 Build Flutter Android Release APK
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Prepare Flutter .env
        run: |
          if [ -n "${{ secrets.PROD_ENV }}" ]; then
            echo "${{ secrets.PROD_ENV }}" > apps/mobile/.env
          elif [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > apps/mobile/.env
          else
            cp apps/mobile/.env.example apps/mobile/.env 2>/dev/null || cp .env.example apps/mobile/.env
          fi

      - name: Install Flutter Dependencies
        run: flutter pub get
        working-directory: apps/mobile

      - name: Build Android Release APK
        run: flutter build apk --release
        working-directory: apps/mobile

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: govia-android-release-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # ============================================================================
  # Stage 3: Zero-Downtime Blue/Green Deployment to Production Server
  # ============================================================================
  deploy:
    name: 🚀 Zero-Downtime Blue/Green Deploy
    needs: [build-api, build-admin]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Payload & Extract Connection Parameters
        run: |
          mkdir -p deploy-payload/scripts/server

          # Unpack unified environment configuration
          if [ -n "${{ secrets.PROD_ENV }}" ]; then
            echo "${{ secrets.PROD_ENV }}" > deploy-payload/.env
          elif [ -n "${{ secrets.ENV_FILE }}" ]; then
            echo "${{ secrets.ENV_FILE }}" > deploy-payload/.env
          else
            cp .env.example deploy-payload/.env
          fi

          # Helper to read .env values
          get_val() {
            local key="$1"
            local fallback="$2"
            local val
            val=$(grep -E "^${key}=" deploy-payload/.env | cut -d'=' -f2- | tr -d '\r' | tr -d '"' | tr -d "'" | head -n 1)
            echo "${val:-$fallback}"
          }

          TARGET_HOST=$(get_val "SERVER_HOST" "${{ secrets.SERVER_HOST || '172.252.13.197' }}")
          TARGET_USER=$(get_val "SERVER_USER" "${{ secrets.SERVER_USER || 'root' }}")
          TARGET_PASS=$(get_val "SERVER_PASSWORD" "${{ secrets.SERVER_PASSWORD }}")
          TARGET_PORT=$(get_val "SERVER_SSH_PORT" "${{ secrets.SERVER_SSH_PORT || '22' }}")
          DOMAIN_NAME=$(get_val "DOMAIN_NAME" "")

          echo "SERVER_HOST=${TARGET_HOST}" >> $GITHUB_ENV
          echo "SERVER_USER=${TARGET_USER}" >> $GITHUB_ENV
          echo "SERVER_PASS=${TARGET_PASS}" >> $GITHUB_ENV
          echo "SERVER_PORT=${TARGET_PORT}" >> $GITHUB_ENV
          echo "DOMAIN_NAME=${DOMAIN_NAME}" >> $GITHUB_ENV

          # Copy compose files and server scripts
          cp docker-compose.bluegreen.yml deploy-payload/
          cp docker-compose.prod.yml deploy-payload/
          cp scripts/server/* deploy-payload/scripts/server/

      - name: Deploy to Remote Server via SSH
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -e
          sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

          export SSHPASS="$SERVER_PASS"

          if [ -z "$SSHPASS" ]; then
            echo "❌ ERROR: SERVER_PASSWORD is not configured in PROD_ENV or GitHub secrets!" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "🚀 Testing SSH connection to ${SERVER_USER}@${SERVER_HOST}:${SERVER_PORT}..."
          if ! sshpass -e ssh -v -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "echo '✅ SSH connection successful! Host: \$(hostname)'" > /tmp/ssh_test.log 2>&1; then
            echo "### ❌ SSH Connection / Authentication Failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            tail -n 35 /tmp/ssh_test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/ssh_test.log
            exit 1
          fi
          echo "✅ SSH connection verified!"

          # 1. Ensure /adnan/govia exists on server
          echo "📦 Verifying directories on server..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "
            mkdir -p /adnan/govia/scripts/server
            if ! command -v docker &>/dev/null; then
              echo '📦 Installing Docker...'
              curl -fsSL https://get.docker.com -o /tmp/get-docker.sh
              sh /tmp/get-docker.sh
            fi
          "

          # 2. Upload configuration, compose manifests, and server scripts
          echo "📤 Uploading configuration and scripts to /adnan/govia..."
          sshpass -e scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SERVER_PORT" deploy-payload/.env deploy-payload/docker-compose.bluegreen.yml deploy-payload/docker-compose.prod.yml "${SERVER_USER}@${SERVER_HOST}:/adnan/govia/"
          sshpass -e scp -r -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SERVER_PORT" deploy-payload/scripts/server/* "${SERVER_USER}@${SERVER_HOST}:/adnan/govia/scripts/server/"

          # 3. Execute Server Bootstrap & Blue/Green Deployment
          echo "🚀 Executing automated server bootstrap and Blue/Green deployment..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SERVER_PORT" "${SERVER_USER}@${SERVER_HOST}" "
            set -e
            cd /adnan/govia
            chmod 600 .env
            chmod +x scripts/server/*.sh

            echo '🔐 Authenticating with GitHub Container Registry...'
            echo \"$GH_TOKEN\" | docker login ghcr.io -u \"$GH_ACTOR\" --password-stdin

            echo '🔧 Running idempotent server bootstrap (swap, Nginx, cron)...'
            GH_REPO_OWNER=\"$REPO_OWNER\" ./scripts/server/bootstrap.sh

            echo '🔄 Executing zero-downtime Blue/Green deployment...'
            GH_REPO_OWNER=\"$REPO_OWNER\" ./scripts/server/deploy-bluegreen.sh

            # Optional Let's Encrypt SSL if DOMAIN_NAME is set
            if [ -n \"$DOMAIN_NAME\" ]; then
              echo \"🔒 Setting up Let's Encrypt SSL for $DOMAIN_NAME...\"
              certbot --nginx -d \"$DOMAIN_NAME\" -d \"api.$DOMAIN_NAME\" -d \"admin.$DOMAIN_NAME\" --non-interactive --agree-tos --register-unsafely-without-email || true
            fi
          "

          echo "🎉 Govia Blue/Green deployment successfully completed on ${SERVER_HOST}!"
          echo "👉 Frontend Admin: http://${SERVER_HOST}:8777"
          echo "👉 Backend API:    http://${SERVER_HOST}:9777/api/v1/docs"
