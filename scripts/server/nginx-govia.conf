# ==============================================================================
# Govia Nginx Reverse Proxy Configuration (Multi-Domain & Blue/Green Aware)
# ==============================================================================

# 1. API Reverse Proxy (api.govia.app)
server {
    listen 80;
    listen [::]:80;
    server_name api.govia.app;

    client_max_body_size 50M;

    location / {
        proxy_pass http://govia_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

# 2. Admin Dashboard Reverse Proxy (admin.govia.app)
server {
    listen 80;
    listen [::]:80;
    server_name admin.govia.app;

    client_max_body_size 50M;

    location / {
        proxy_pass http://govia_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 3. Root Domain & WWW 301 Permanent Redirect (to Admin portal)
server {
    listen 80;
    listen [::]:80;
    server_name govia.app www.govia.app;
    return 301 https://admin.govia.app$request_uri;
}

# 4. Default Server (Direct IP Fallback: 108.175.15.205)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 50M;

    # Direct /api and /socket.io routes to API Backend
    location /api/ {
        proxy_pass http://govia_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /socket.io/ {
        proxy_pass http://govia_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location /health {
        proxy_pass http://govia_api_upstream/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # All other routes go to Admin Frontend
    location / {
        proxy_pass http://govia_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
